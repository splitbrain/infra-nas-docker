# Tests the Tailscale policy file for pull requests and applies it to the tailnet on push to main.
#
# Setup of the federated identity in the Tailscale admin console:
#   1. Open "Trust credentials", select "Credential", then "OpenID Connect".
#   2. Issuer: GitHub Actions
#   3. Subject: repo:splitbrain/infra-nas-docker:*
#   4. Scope: Policy File (write)
#   5. Select "Generate credential".
#
# Repository secrets:
#   TS_OAUTH_ID  - client ID of the federated identity
#   TS_AUDIENCE  - audience of the federated identity
#   TS_TAILNET   - tailnet ID, shown in Settings → General of the admin console

name: Sync Tailscale policy

on:
  push:
    branches: [ "main" ]
    paths: [ "tailscale/conf/policy.hujson", ".github/workflows/tailscale.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "tailscale/conf/policy.hujson", ".github/workflows/tailscale.yml" ]

jobs:
  policy:
    permissions:
      contents: read
      id-token: write # required to request a JWT from GitHub for the federated identity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Fetch version-cache.json
        uses: actions/cache@v5
        with:
          path: ./version-cache.json
          key: version-cache.json-${{ github.run_id }}
          restore-keys: |
            version-cache.json-

      - name: Deploy policy
        if: github.event_name == 'push'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: tailscale/conf/policy.hujson
          action: apply

      # pull requests from forks get no secrets, so they can not be tested
      - name: Test policy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tailnet: ${{ secrets.TS_TAILNET }}
          policy-file: tailscale/conf/policy.hujson
          action: test
