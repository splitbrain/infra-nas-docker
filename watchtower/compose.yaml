services:
  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    command:
      - "--cleanup"
      - "--remove-volumes"
    environment:
      WATCHTOWER_NOTIFICATION_URL: smtp://192.168.1.33:25/?fromaddress=watchtower@69b.place&fromname=Watchtower&toaddresses=splitbrain@gmail.com&auth=None
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: nas
      # update API, public at /watchtower/update through the Tailscale Funnel
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
    networks:
      - tailscale

networks:
  tailscale:
    name: tailscale
    external: true
